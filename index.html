<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kopffrei">
    <title>Kopffrei - Mehr schaffen, weniger tun</title>
    <link rel="manifest" href="manifest.json">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #root { min-height: 100vh; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Plus = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const Check = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>;
        const X = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const Trash2 = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
        const Edit2 = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>;
        const ChevronRight = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="9 18 15 12 9 6"/></svg>;
        const Calendar = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
        const Circle = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/></svg>;
        const Star = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
        const AlertCircle = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>;
        const Download = ({size = 24}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;

        const STORAGE_KEY = 'kopffrei-data';

        const KopffreiApp = () => {
            const [activeTab, setActiveTab] = useState('sammelbecken');
            const [sammelbecken, setSammelbecken] = useState([]);
            const [durchgegangen, setDurchgegangen] = useState([]);
            const [fokus, setFokus] = useState([]);
            const [done, setDone] = useState([]);
            const [irgendwann, setIrgendwann] = useState([]);
            const [stopDoing, setStopDoing] = useState([]);
            const [nordstern, setNordstern] = useState('');
            const [newTask, setNewTask] = useState('');
            const [newTaskDeadline, setNewTaskDeadline] = useState('');
            const [editingTask, setEditingTask] = useState(null);
            const [editText, setEditText] = useState('');
            const [editDeadline, setEditDeadline] = useState('');
            const [showDeadlineInput, setShowDeadlineInput] = useState(false);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [showInstallButton, setShowInstallButton] = useState(false);
            const [loaded, setLoaded] = useState(false);
            const [backupText, setBackupText] = useState('');
            const [backupMsg, setBackupMsg] = useState('');

            // PWA Installation
            useEffect(() => {
                const handler = (e) => {
                    e.preventDefault();
                    setDeferredPrompt(e);
                    setShowInstallButton(true);
                };
                window.addEventListener('beforeinstallprompt', handler);
                return () => window.removeEventListener('beforeinstallprompt', handler);
            }, []);

            const handleInstallClick = async () => {
                if (!deferredPrompt) return;
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') setShowInstallButton(false);
                setDeferredPrompt(null);
            };

            // Laden
            useEffect(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        setSammelbecken(data.sammelbecken || []);
                        setDurchgegangen(data.durchgegangen || []);
                        setFokus(data.fokus || []);
                        setDone(data.done || []);
                        setIrgendwann(data.irgendwann || []);
                        setStopDoing(data.stopDoing || []);
                        setNordstern(data.nordstern || '');
                    }
                } catch (e) {
                    console.log('Laden fehlgeschlagen', e);
                }
                setLoaded(true);
            }, []);

            // Speichern (erst nach dem Laden, damit nichts überschrieben wird)
            useEffect(() => {
                if (!loaded) return;
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    sammelbecken, durchgegangen, fokus, done, irgendwann, stopDoing, nordstern
                }));
            }, [loaded, sammelbecken, durchgegangen, fokus, done, irgendwann, stopDoing, nordstern]);

            // Backup
            const getBackupString = () => JSON.stringify({
                app: 'kopffrei',
                version: 1,
                exportedAt: new Date().toISOString(),
                sammelbecken, durchgegangen, fokus, done, irgendwann, stopDoing, nordstern
            });

            const copyBackup = async () => {
                const text = getBackupString();
                setBackupText(text);
                try {
                    await navigator.clipboard.writeText(text);
                    setBackupMsg('✅ Backup kopiert! Füge es jetzt in einer Notiz ein.');
                } catch (e) {
                    setBackupMsg('⚠️ Automatisches Kopieren hat nicht geklappt. Markiere den Text unten und kopiere ihn von Hand.');
                }
            };

            const restoreBackup = () => {
                try {
                    const data = JSON.parse(backupText);
                    if (data.app !== 'kopffrei') throw new Error('Kein Kopffrei-Backup');
                    if (!window.confirm('Aktuelle Aufgaben werden durch das Backup ersetzt. Fortfahren?')) return;
                    setSammelbecken(data.sammelbecken || []);
                    setDurchgegangen(data.durchgegangen || []);
                    setFokus(data.fokus || []);
                    setDone(data.done || []);
                    setIrgendwann(data.irgendwann || []);
                    setStopDoing(data.stopDoing || []);
                    setNordstern(data.nordstern || '');
                    setBackupMsg('✅ Backup wiederhergestellt!');
                    setBackupText('');
                } catch (e) {
                    setBackupMsg('❌ Das war kein gültiges Backup. Bitte den kompletten Text einfügen.');
                }
            };

            const addTask = () => {
                if (newTask.trim()) {
                    setSammelbecken([...sammelbecken, {
                        id: Date.now(),
                        text: newTask,
                        deadline: newTaskDeadline || null,
                        createdAt: new Date().toISOString()
                    }]);
                    setNewTask('');
                    setNewTaskDeadline('');
                    setShowDeadlineInput(false);
                }
            };

            const getDeadlineStatus = (deadline) => {
                if (!deadline) return null;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const deadlineDate = new Date(deadline);
                deadlineDate.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((deadlineDate - today) / (1000 * 60 * 60 * 24));

                if (diffDays < 0) return { status: 'overdue', color: 'red', text: 'Überfällig!' };
                if (diffDays === 0) return { status: 'today', color: 'red', text: 'Heute!' };
                if (diffDays === 1) return { status: 'tomorrow', color: 'orange', text: 'Morgen' };
                if (diffDays <= 3) return { status: 'soon', color: 'orange', text: `In ${diffDays} Tagen` };
                if (diffDays <= 7) return { status: 'week', color: 'yellow', text: `In ${diffDays} Tagen` };
                return { status: 'normal', color: 'blue', text: `In ${diffDays} Tagen` };
            };

            const formatDate = (dateString) => {
                if (!dateString) return '';
                return new Date(dateString).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            };

            const moveTask = (task, fromList, toList) => {
                const setters = { sammelbecken: setSammelbecken, durchgegangen: setDurchgegangen, fokus: setFokus, done: setDone, irgendwann: setIrgendwann };
                setters[fromList](prev => prev.filter(t => t.id !== task.id));
                setters[toList](prev => [...prev, task]);
            };

            const deleteTask = (taskId, listName) => {
                const setters = { sammelbecken: setSammelbecken, durchgegangen: setDurchgegangen, fokus: setFokus, done: setDone, irgendwann: setIrgendwann, stopDoing: setStopDoing };
                setters[listName](prev => prev.filter(t => t.id !== taskId));
            };

            const startEdit = (task) => {
                setEditingTask(task.id);
                setEditText(task.text);
                setEditDeadline(task.deadline || '');
            };

            const saveEdit = (taskId, listName) => {
                const setters = { sammelbecken: setSammelbecken, durchgegangen: setDurchgegangen, fokus: setFokus, done: setDone, irgendwann: setIrgendwann };
                setters[listName](prev => prev.map(t => t.id === taskId ? { ...t, text: editText, deadline: editDeadline || null } : t));
                setEditingTask(null);
                setEditText('');
                setEditDeadline('');
            };

            const getTasksWithDeadlines = () => {
                return [
                    ...sammelbecken.map(t => ({...t, list: 'sammelbecken', listName: 'Sammelbecken'})),
                    ...durchgegangen.map(t => ({...t, list: 'durchgegangen', listName: 'Durchgegangen'})),
                    ...fokus.map(t => ({...t, list: 'fokus', listName: 'Fokus'})),
                    ...irgendwann.map(t => ({...t, list: 'irgendwann', listName: 'Irgendwann-vielleicht'}))
                ].filter(t => t.deadline).sort((a, b) => new Date(a.deadline) - new Date(b.deadline));
            };

            // Wird als normale Funktion aufgerufen (nicht als Komponente),
            // damit das Eingabefeld beim Tippen den Fokus behält.
            const renderTask = (task, listName) => {
                const deadlineStatus = getDeadlineStatus(task.deadline);
                const borderColors = { red: 'border-red-400 bg-red-50', orange: 'border-orange-400 bg-orange-50', yellow: 'border-yellow-400 bg-yellow-50', blue: 'border-blue-100 bg-white' };
                const badgeColors = { red: 'bg-red-500 text-white', orange: 'bg-orange-500 text-white', yellow: 'bg-yellow-500 text-white', blue: 'bg-blue-100 text-blue-700' };

                return (
                    <div key={task.id} className={`rounded-xl p-4 mb-3 shadow-sm border ${deadlineStatus ? borderColors[deadlineStatus.color] : 'border-blue-100 bg-white'}`}>
                        {editingTask === task.id ? (
                            <div className="space-y-3">
                                <input type="text" value={editText} onChange={(e) => setEditText(e.target.value)} className="w-full p-2 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" autoFocus />
                                <div className="flex items-center gap-2">
                                    <Calendar size={18} />
                                    <input type="date" value={editDeadline} onChange={(e) => setEditDeadline(e.target.value)} className="flex-1 p-2 border border-blue-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                    {editDeadline && <button onClick={() => setEditDeadline('')} className="text-gray-400"><X size={18} /></button>}
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => saveEdit(task.id, listName)} className="flex-1 p-2 bg-green-500 text-white rounded-lg font-semibold">Speichern</button>
                                    <button onClick={() => { setEditingTask(null); setEditText(''); setEditDeadline(''); }} className="p-2 bg-gray-300 rounded-lg"><X size={20} /></button>
                                </div>
                            </div>
                        ) : (
                            <>
                                <div className="flex items-start justify-between mb-2">
                                    <div className="flex-1">
                                        <p className="text-gray-800 font-medium mb-2">{task.text}</p>
                                        {task.deadline && (
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <span className={`text-xs px-2 py-1 rounded-full font-semibold flex items-center gap-1 ${badgeColors[deadlineStatus.color]}`}>
                                                    {deadlineStatus.status === 'overdue' && <AlertCircle size={12} />}
                                                    <Calendar size={12} />
                                                    {formatDate(task.deadline)}
                                                </span>
                                                <span className={`text-xs font-semibold ${deadlineStatus.color === 'red' ? 'text-red-600' : deadlineStatus.color === 'orange' ? 'text-orange-600' : deadlineStatus.color === 'yellow' ? 'text-yellow-600' : 'text-blue-600'}`}>
                                                    {deadlineStatus.text}
                                                </span>
                                            </div>
                                        )}
                                    </div>
                                    <button onClick={() => deleteTask(task.id, listName)} className="text-red-400 hover:text-red-600 ml-2"><Trash2 size={18} /></button>
                                </div>
                                <div className="flex gap-2 flex-wrap mt-3">
                                    <button onClick={() => startEdit(task)} className="text-xs px-3 py-1.5 bg-gray-100 text-gray-600 rounded-lg flex items-center gap-1"><Edit2 size={14} />Bearbeiten</button>
                                    {listName === 'sammelbecken' && <button onClick={() => moveTask(task, 'sammelbecken', 'durchgegangen')} className="text-xs px-3 py-1.5 bg-blue-500 text-white rounded-lg flex items-center gap-1">Durchgegangen<ChevronRight size={14} /></button>}
                                    {listName === 'durchgegangen' && (
                                        <>
                                            <button onClick={() => moveTask(task, 'durchgegangen', 'fokus')} className="text-xs px-3 py-1.5 bg-green-500 text-white rounded-lg">In Fokus</button>
                                            <button onClick={() => moveTask(task, 'durchgegangen', 'irgendwann')} className="text-xs px-3 py-1.5 bg-purple-400 text-white rounded-lg">Später</button>
                                        </>
                                    )}
                                    {listName === 'fokus' && <button onClick={() => moveTask(task, 'fokus', 'done')} className="text-xs px-3 py-1.5 bg-green-600 text-white rounded-lg flex items-center gap-1"><Check size={14} />Erledigt</button>}
                                    {listName === 'irgendwann' && <button onClick={() => moveTask(task, 'irgendwann', 'durchgegangen')} className="text-xs px-3 py-1.5 bg-blue-500 text-white rounded-lg">Jetzt angehen</button>}
                                </div>
                            </>
                        )}
                    </div>
                );
            };

            return (
                <div className="max-w-md mx-auto bg-gradient-to-b from-blue-50 to-green-50 min-h-screen">
                    <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-6 rounded-b-3xl shadow-lg">
                        <div className="flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-bold mb-1">Kopffrei</h1>
                                <p className="text-blue-100 text-sm">Mehr schaffen, weniger tun</p>
                            </div>
                            {showInstallButton && (
                                <button onClick={handleInstallClick} className="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold flex items-center gap-2 hover:bg-blue-50">
                                    <Download size={18} />Installieren
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="p-5 pb-28">
                        {activeTab === 'sammelbecken' && (
                            <div>
                                <div className="mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2"><Circle size={24} />Sammelbecken</h2>
                                    <p className="text-gray-600 text-sm">Alles raus aus dem Kopf!</p>
                                </div>
                                <div className="mb-6 bg-white rounded-2xl p-4 shadow-md">
                                    <div className="flex gap-2 mb-3">
                                        <input type="text" value={newTask} onChange={(e) => setNewTask(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addTask()} placeholder="Neue Aufgabe..." className="flex-1 p-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 text-gray-800" />
                                        <button onClick={addTask} className="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-5 rounded-xl shadow-md"><Plus /></button>
                                    </div>
                                    {!showDeadlineInput ? (
                                        <button onClick={() => setShowDeadlineInput(true)} className="text-sm text-blue-600 flex items-center gap-1"><Calendar size={16} />Deadline hinzufügen</button>
                                    ) : (
                                        <div className="flex items-center gap-2">
                                            <Calendar size={18} />
                                            <input type="date" value={newTaskDeadline} onChange={(e) => setNewTaskDeadline(e.target.value)} className="flex-1 p-2 border-2 border-blue-200 rounded-lg focus:outline-none focus:border-blue-500" />
                                            <button onClick={() => { setShowDeadlineInput(false); setNewTaskDeadline(''); }} className="text-gray-400"><X size={20} /></button>
                                        </div>
                                    )}
                                </div>
                                <div className="space-y-3">
                                    {sammelbecken.length === 0 ? (
                                        <div className="text-center py-12 text-gray-400">
                                            <p>Dein Sammelbecken ist leer</p>
                                        </div>
                                    ) : sammelbecken.map(task => renderTask(task, 'sammelbecken'))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'board' && (
                            <div className="space-y-6">
                                {getTasksWithDeadlines().length > 0 && (
                                    <div className="bg-white rounded-2xl p-5 shadow-md border-2 border-blue-200">
                                        <h2 className="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2"><Calendar size={20} />Anstehende Deadlines</h2>
                                        <div className="space-y-2">
                                            {getTasksWithDeadlines().slice(0, 5).map(task => {
                                                const status = getDeadlineStatus(task.deadline);
                                                return (
                                                    <div key={task.id} className="flex items-center justify-between p-2 bg-gray-50 rounded-lg">
                                                        <div className="flex-1">
                                                            <p className="text-sm font-medium text-gray-800">{task.text}</p>
                                                            <p className="text-xs text-gray-500">{task.listName}</p>
                                                        </div>
                                                        <span className={`text-xs px-2 py-1 rounded-full font-semibold whitespace-nowrap ml-2 ${status.color === 'red' ? 'bg-red-500 text-white' : status.color === 'orange' ? 'bg-orange-500 text-white' : status.color === 'yellow' ? 'bg-yellow-500 text-white' : 'bg-blue-100 text-blue-700'}`}>{status.text}</span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-3">Durchgegangen</h2>
                                    <p className="text-gray-500 text-xs mb-3">2x pro Woche durchsehen</p>
                                    {durchgegangen.length === 0 ? <p className="text-gray-400 text-sm italic">Keine Aufgaben</p> : durchgegangen.map(task => renderTask(task, 'durchgegangen'))}
                                </div>
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-3">Fokus</h2>
                                    <p className="text-gray-500 text-xs mb-3">Max. 2-3 Aufgaben</p>
                                    {fokus.length === 0 ? <p className="text-gray-400 text-sm italic">Keine Aufgaben</p> : fokus.map(task => renderTask(task, 'fokus'))}
                                </div>
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2"><Check size={20} />Erledigt</h2>
                                    {done.length === 0 ? <p className="text-gray-400 text-sm italic">Noch nichts erledigt</p> : done.map(task => (
                                        <div key={task.id} className="bg-green-50 rounded-xl p-4 border border-green-200 mb-3">
                                            <div className="flex items-center justify-between">
                                                <div className="flex-1">
                                                    <p className="text-gray-700 line-through">{task.text}</p>
                                                    {task.deadline && <p className="text-xs text-gray-500 mt-1">Deadline war: {formatDate(task.deadline)}</p>}
                                                </div>
                                                <button onClick={() => deleteTask(task.id, 'done')} className="text-red-400 ml-2"><Trash2 size={18} /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div>
                                    <h2 className="text-xl font-bold text-gray-800 mb-3">Irgendwann-vielleicht</h2>
                                    {irgendwann.length === 0 ? <p className="text-gray-400 text-sm italic">Keine Projekte</p> : irgendwann.map(task => renderTask(task, 'irgendwann'))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'mehr' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-2xl p-5 shadow-md">
                                    <h2 className="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2"><Star size={20} />Mein Nordstern</h2>
                                    <textarea value={nordstern} onChange={(e) => setNordstern(e.target.value)} placeholder="Meine Vision..." className="w-full p-3 border-2 border-blue-200 rounded-xl focus:outline-none focus:border-blue-500 min-h-32" />
                                </div>
                                <div className="bg-white rounded-2xl p-5 shadow-md">
                                    <h2 className="text-xl font-bold text-gray-800 mb-3 flex items-center gap-2"><X size={20} />Stop-Doing Liste</h2>
                                    <input type="text" placeholder="Neue Sache..." className="w-full p-2 border-2 border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 mb-3" onKeyPress={(e) => { if (e.key === 'Enter' && e.target.value.trim()) { setStopDoing([...stopDoing, { id: Date.now(), text: e.target.value }]); e.target.value = ''; }}} />
                                    {stopDoing.map(item => (
                                        <div key={item.id} className="bg-red-50 rounded-lg p-3 flex justify-between border border-red-100 mb-2">
                                            <p className="text-sm">{item.text}</p>
                                            <button onClick={() => deleteTask(item.id, 'stopDoing')} className="text-red-400"><Trash2 size={16} /></button>
                                        </div>
                                    ))}
                                </div>

                                {/* Datensicherung */}
                                <div className="bg-white rounded-2xl p-5 shadow-md border-2 border-green-200">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">💾 Datensicherung</h2>
                                    <p className="text-gray-600 text-sm mb-4">
                                        Kopiere dein Backup und füge es in eine Notiz ein. Zum Wiederherstellen fügst du den Text unten ein.
                                    </p>
                                    <button onClick={copyBackup} className="w-full py-3 bg-gradient-to-r from-green-500 to-green-600 text-white rounded-xl font-semibold shadow-md mb-3">
                                        Backup kopieren
                                    </button>
                                    <textarea
                                        value={backupText}
                                        onChange={(e) => setBackupText(e.target.value)}
                                        placeholder="Zum Wiederherstellen: Backup hier einfügen..."
                                        className="w-full p-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 text-xs min-h-24 mb-3"
                                    />
                                    <button onClick={restoreBackup} disabled={!backupText.trim()} className="w-full py-3 bg-blue-500 text-white rounded-xl font-semibold disabled:opacity-40">
                                        Backup wiederherstellen
                                    </button>
                                    {backupMsg && <p className="text-sm mt-3 text-gray-700">{backupMsg}</p>}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg max-w-md mx-auto">
                        <div className="flex justify-around p-3">
                            <button onClick={() => setActiveTab('sammelbecken')} className={`flex-1 py-3 rounded-xl font-semibold ${activeTab === 'sammelbecken' ? 'bg-gradient-to-r from-blue-500 to-blue-600 text-white shadow-md' : 'text-gray-500'}`}>Sammeln</button>
                            <button onClick={() => setActiveTab('board')} className={`flex-1 py-3 rounded-xl font-semibold mx-2 ${activeTab === 'board' ? 'bg-gradient-to-r from-green-500 to-green-600 text-white shadow-md' : 'text-gray-500'}`}>Board</button>
                            <button onClick={() => setActiveTab('mehr')} className={`flex-1 py-3 rounded-xl font-semibold ${activeTab === 'mehr' ? 'bg-gradient-to-r from-purple-500 to-purple-600 text-white shadow-md' : 'text-gray-500'}`}>Mehr</button>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<KopffreiApp />, document.getElementById('root'));
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(() => console.log('Service Worker registriert'))
                    .catch(err => console.log('Service Worker Fehler:', err));
            });
        }
    </script>
</body>
</html>
